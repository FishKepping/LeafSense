# Example LeafSense device using the reusable XIAO ESP32-S3 Sense package.
# Copy secrets.example.yaml to secrets.yaml and enter your own values before use.

substitutions:
  device_name: leafsense-xiao-vision
  friendly_name: LeafSense XIAO Vision

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

packages:
  xiao_vision: !include ../../packages/leafsense_xiao_esp32s3_sense.yaml

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "${friendly_name} Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:
