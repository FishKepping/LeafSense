<!doctype html>
<html><head><meta charset="utf-8"><title>LeafSense card tests</title></head>
<body><pre id="out"></pre><script src="../www/leafsense-thermal-card.js"></script><script>
const out=document.getElementById('out');let failed=0;
function test(name,fn){try{fn();out.textContent+=`PASS ${name}\n`;}catch(e){failed++;out.textContent+=`FAIL ${name}: ${e.message}\n`;}}
function assert(v,m){if(!v)throw new Error(m);}
function near(a,b,e=.001){assert(Math.abs(a-b)<=e,`${a} != ${b}`);}
test('CRC32 standard vector',()=>{const bytes=new TextEncoder().encode('123456789');assert(window.LeafSenseThermal.crc32(bytes)===0xcbf43926,'CRC mismatch');});
test('Palette endpoints differ',()=>{const a=window.LeafSenseThermal.colourFor(0),b=window.LeafSenseThermal.colourFor(1);assert(JSON.stringify(a)!==JSON.stringify(b),'palette endpoints equal');});
test('Card registered',()=>assert(customElements.get('leafsense-thermal-card'),'custom element absent'));
test('Celsius converts to Fahrenheit',()=>near(window.LeafSenseThermal.toDisplayTemperature(0,'°F'),32));
test('Fahrenheit converts to Celsius',()=>near(window.LeafSenseThermal.fromDisplayTemperature(212,'°F'),100));
test('Rectangle creates four corners',()=>{const p=window.LeafSenseThermal.rectangleCorners({x:1,y:2},{x:5,y:6});assert(p.length===4,'wrong corner count');assert(p[2].x===5&&p[2].y===6,'wrong opposite corner');});
test('Rotation preserves centre distance',()=>{const c={x:4,y:4},p={x:5,y:4},r=window.LeafSenseThermal.rotatePoint(p,c,Math.PI/2);near(r.x,4);near(r.y,5);});
test('ROI storage is scoped to the device but stable across service renames',()=>{const Card=window.LeafSenseThermal.LeafSenseThermalCard;const a=Object.create(Card.prototype),b=Object.create(Card.prototype),renamed=Object.create(Card.prototype);a.config={entity:'text_sensor.camera_a',service_prefix:'esphome.camera_a'};b.config={entity:'text_sensor.camera_b',service_prefix:'esphome.camera_b'};renamed.config={entity:'text_sensor.camera_a',service_prefix:'esphome.renamed'};assert(a.roiStorageKey()!==b.roiStorageKey(),'device storage keys collide');assert(a.roiStorageKey()===renamed.roiStorageKey(),'service rename changed persistence key');});
test('Stored pixel masks are validated and names are restored',()=>{const Card=window.LeafSenseThermal.LeafSenseThermalCard;const card=Object.create(Card.prototype);card.config={entity:'text_sensor.persistence_test',service_prefix:'esphome.persistence_test'};const fallback=Array.from({length:6},(_,i)=>({channel:i+1,type:'disabled',pixels:[],name:`ROI ${i+1}`}));const stored=structuredClone(fallback);stored[0]={channel:99,type:'pixels',pixels:[0,0,9,-1,64,2.5],name:'Leaf canopy'};localStorage.setItem(card.roiStorageKey(),JSON.stringify(stored));const loaded=card.loadRois(fallback);assert(loaded[0].channel===1,'channel identity was not normalised');assert(loaded[0].pixels.join(',')==='0,9','pixel validation failed');assert(loaded[0].name==='Leaf canopy','custom name was not restored');localStorage.removeItem(card.roiStorageKey());});
test('Painted pixels persist before the delayed ESP save',()=>{const Card=window.LeafSenseThermal.LeafSenseThermalCard;const entity='text_sensor.immediate_persistence_test';const card=new Card();card.setConfig({entity});card.tool='pixels';card.drag={kind:'paint-pixels',erase:false,visited:new Set()};card.paintPixel(17);const stored=JSON.parse(localStorage.getItem(card.roiStorageKey()));assert(stored[0].type==='pixels','painted ROI was not enabled in storage');assert(stored[0].pixels.includes(17),'painted pixel was not saved immediately');card.disconnectedCallback();const restored=new Card();restored.setConfig({entity});assert(restored.rois[0].pixels.includes(17),'painted pixel did not restore after card recreation');restored.disconnectedCallback();localStorage.removeItem(restored.roiStorageKey());});
test('Pixel editor starts inactive and Undo is removed',()=>{const Card=window.LeafSenseThermal.LeafSenseThermalCard;const card=new Card();card.setConfig({entity:'text_sensor.ui_test'});const editor=card.querySelector('[data-tool="pixels"]');assert(editor&&!editor.classList.contains('active'),'pixel editor should start inactive');assert(!card.querySelector('.undo'),'undo should not be shown');assert(card.querySelector('.clearRoi'),'clear ROI action is missing');card.disconnectedCallback();});
test('Clear ROI empties and disables the selected channel',()=>{const Card=window.LeafSenseThermal.LeafSenseThermalCard;const card=new Card();card.setConfig({entity:'text_sensor.clear_test'});card.rois[0]={channel:1,type:'pixels',pixels:[0,1],name:'Canopy'};card.applyRoi=()=>{};card.clearSelectedRoi();assert(card.rois[0].type==='disabled','ROI was not disabled');assert(card.rois[0].pixels.length===0,'pixels were not cleared');assert(card.rois[0].name==='Canopy','name should be retained');card.disconnectedCallback();});
test('Gain and offset accept typed decimal values',()=>{const Card=window.LeafSenseThermal.LeafSenseThermalCard;const card=new Card();card.setConfig({entity:'text_sensor.calibration_test'});const gain=card.querySelector('.calGain'),offset=card.querySelector('.calOffset');assert(gain.type==='number'&&gain.inputMode==='decimal','gain is not a decimal input');assert(offset.type==='number'&&offset.inputMode==='decimal','offset is not a decimal input');card.disconnectedCallback();});
test('Legend is vertical and left of thermal frame',()=>{const Card=window.LeafSenseThermal.LeafSenseThermalCard;const card=new Card();card.setConfig({entity:'text_sensor.legend_test'});const row=card.querySelector('.thermalrow');assert(row.firstElementChild.classList.contains('legendrow'),'legend is not first/left');assert(row.lastElementChild.classList.contains('stage'),'thermal stage is not beside legend');card.disconnectedCallback();});
test('Turning legend off preserves the thermal stage layout',()=>{const Card=window.LeafSenseThermal.LeafSenseThermalCard;const card=new Card();card.setConfig({entity:'text_sensor.legend_hidden_test'});card.settings.showLegend=false;card.updateLegend(20,30);const row=card.querySelector('.thermalrow');const legend=card.querySelector('.legendrow');const stage=card.querySelector('.stage');assert(row.classList.contains('legend-hidden'),'single-column layout was not enabled');assert(legend.style.display==='none','legend was not hidden');assert(stage&&stage.parentElement===row,'thermal stage was removed with legend');card.disconnectedCallback();});
test('Full-frame statistics have a dedicated display',()=>{const Card=window.LeafSenseThermal.LeafSenseThermalCard;const card=new Card();card.setConfig({entity:'text_sensor.frame_stats_test'});assert(card.querySelector('.frameStats'),'full-frame statistics display missing');assert(card.querySelector('.cursor'),'cursor display missing');card.disconnectedCallback();});
test('Calibration drafts retain typed values during HA refreshes',()=>{const Card=window.LeafSenseThermal.LeafSenseThermalCard;const card=new Card();card.setConfig({entity:'text_sensor.calibration_draft_test'});const gain=card.querySelector('.calGain');gain.value='1.234';gain.dispatchEvent(new Event('input',{bubbles:true}));assert(card.calibrationDrafts.gain==='1.234','typed gain draft was not retained');card.disconnectedCallback();});
test('ROI name draft starts on focus and survives tab refresh',()=>{const Card=window.LeafSenseThermal.LeafSenseThermalCard;const card=new Card();card.setConfig({entity:'text_sensor.name_draft_test'});const input=card.querySelector('.roiName');input.dispatchEvent(new Event('focus'));input.value='Canopy';input.dispatchEvent(new Event('input',{bubbles:true}));card.updateChannelTabs();assert(input.value==='Canopy','ROI name draft was replaced');card.disconnectedCallback();});
test('Used ROI button border matches its pixel colour',()=>{const Card=window.LeafSenseThermal.LeafSenseThermalCard;const card=new Card();card.setConfig({entity:'text_sensor.roi_colour_test'});card.rois[1]={channel:2,type:'pixels',pixels:[1],name:'ROI 2'};card.updateChannelTabs();const button=card.querySelector('[data-channel="2"]');assert(button.style.getPropertyValue('--roi-colour')==='#ffea00','ROI 2 colour did not reach its button');card.disconnectedCallback();});
test('Channel statistics fall back to live frame pixels',()=>{const Card=window.LeafSenseThermal.LeafSenseThermalCard;const card=new Card();card.setConfig({entity:'text_sensor.channel_fallback_test'});card.rois[5]={channel:6,type:'pixels',pixels:[0,1,2],name:'ROI 6'};card.frame={temperatures:[10,20,30]};const stats=card.channelStats(6);near(stats.minimum,10);near(stats.average,20);near(stats.maximum,30);assert(stats.source==='frame','frame fallback not used');card.disconnectedCallback();});
out.textContent+=failed?'\nTESTS FAILED':'\nALL TESTS PASSED';document.title=failed?'FAILED':'PASSED';
</script></body></html>
