i2c:
  id: bme688_i2c_bus
  sda: ${bme688_sda_pin}
  scl: ${bme688_scl_pin}
  frequency: 100kHz
  scan: true

bme68x_bsec2_i2c:
  id: bme688_bsec2
  i2c_id: bme688_i2c_bus
  address: ${bme688_i2c_address}
  model: BME688
  algorithm_output: classification
  operating_age: 28d
  sample_rate: LP
  supply_voltage: 3.3V
  temperature_offset: ${bme688_temperature_offset}
  state_save_interval: 6h

sensor:
  - platform: bme68x_bsec2
    bme68x_bsec2_id: bme688_bsec2
    temperature:
      name: "BME688 Temperature"
      id: bme688_temperature
    pressure:
      name: "BME688 Pressure"
      id: bme688_pressure
    humidity:
      name: "BME688 Humidity"
      id: bme688_humidity
    gas_resistance:
      name: "BME688 Gas Resistance"
      id: bme688_gas_resistance
    iaq:
      name: "BME688 IAQ"
      id: bme688_iaq
    iaq_static:
      name: "BME688 Static IAQ"
      id: bme688_static_iaq
    iaq_accuracy:
      name: "BME688 IAQ Accuracy"
      id: bme688_iaq_accuracy
    co2_equivalent:
      name: "BME688 CO2 Equivalent"
      id: bme688_co2_equivalent
    breath_voc_equivalent:
      name: "BME688 Breath VOC Equivalent"
      id: bme688_breath_voc_equivalent

  - platform: template
    id: leafsense_air_vpd
    name: "LeafSense Air VPD"
    unit_of_measurement: "kPa"
    device_class: pressure
    state_class: measurement
    icon: "mdi:water-percent"
    accuracy_decimals: 3
    update_interval: 3s
    lambda: |-
      const float air_temperature = id(bme688_temperature).state;
      const float relative_humidity = id(bme688_humidity).state;

      if (!std::isfinite(air_temperature) ||
          !std::isfinite(relative_humidity) ||
          relative_humidity < 0.0f || relative_humidity > 100.0f) {
        return NAN;
      }

      // Tetens saturation vapour pressure equation, with temperature in °C.
      const float saturation_vapour_pressure =
          0.6108f * expf((17.27f * air_temperature) /
                         (air_temperature + 237.3f));
      return saturation_vapour_pressure * (1.0f - relative_humidity / 100.0f);

text_sensor:
  - platform: bme68x_bsec2
    bme68x_bsec2_id: bme688_bsec2
    iaq_accuracy:
      name: "BME688 IAQ Accuracy Status"

button:
  - platform: restart
    name: "BME688 Restart"

binary_sensor:
  - platform: status
    name: "BME688 Status"
