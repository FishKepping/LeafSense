number:
  - platform: template
    id: leafsense_calibration_gain
    name: "LeafSense Calibration Gain"
    entity_category: config
    optimistic: true
    restore_value: false
    min_value: 0.5
    max_value: 1.5
    step: 0.001
    initial_value: 1.0
    set_action:
      - lambda: |-
          if (!id(leafsense_thermal).set_calibration_gain(x)) {
            ESP_LOGE("leafsense.calibration", "Rejected gain %.4f", x);
          }

  - platform: template
    id: leafsense_calibration_offset
    name: "LeafSense Calibration Offset"
    entity_category: config
    unit_of_measurement: "°C"
    device_class: temperature
    optimistic: true
    restore_value: false
    min_value: -20.0
    max_value: 20.0
    step: 0.1
    initial_value: 0.0
    set_action:
      - lambda: |-
          if (!id(leafsense_thermal).set_calibration_offset(x)) {
            ESP_LOGE("leafsense.calibration", "Rejected offset %.3f", x);
          }

button:
  - platform: template
    name: "LeafSense Save Calibration"
    entity_category: config
    on_press:
      - lambda: id(leafsense_thermal).save_calibration();

  - platform: template
    name: "LeafSense Restore Calibration Defaults"
    entity_category: config
    on_press:
      - lambda: |-
          id(leafsense_thermal).restore_calibration_defaults();
          id(leafsense_calibration_gain).publish_state(id(leafsense_thermal).calibration_gain());
          id(leafsense_calibration_offset).publish_state(id(leafsense_thermal).calibration_offset());
